[package]
name = "wbash-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI binaries (w, w-bash) for w-bash"
repository.workspace = true
readme.workspace = true
authors.workspace = true

[[bin]]
name = "w"
path = "src/main.rs"

[[bin]]
name = "w-bash"
path = "src/bin/w-bash.rs"

[dependencies]
wbash-core = { path = "../wbash-core" }
wbash-index = { path = "../wbash-index" }
wbash-parsers = { path = "../wbash-parsers" }
wbash-tools = { path = "../wbash-tools" }
wbash-adapters = { path = "../wbash-adapters" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
