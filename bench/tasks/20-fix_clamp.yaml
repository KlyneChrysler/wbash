id: fix_clamp
kind: fix_failing_test
prompt: "Run the tests, find the failing function, and fix it."
fixture: "fixtures/rust_calc"
setup:
  - "cp variants/bug_clamp.rs src/lib.rs"
check: "cargo test -q"
bash:
  - "cargo test -q 2>&1 | tail -20"
  - "perl -0pi -e \"s/\\Q    let _ = (lo, hi);\n    v\\E/    if v < lo {\n        lo\n    } else if v > hi {\n        hi\n    } else {\n        v\n    }/\" src/lib.rs"
w:
  - "w --tier execute run -- cargo test -q"
  - "w read src/lib.rs --budget 700"
  - "w edit src/lib.rs find=\"let _ = (lo, hi);\n    v\" replace=\"if v < lo {\n        lo\n    } else if v > hi {\n        hi\n    } else {\n        v\n    }\""
