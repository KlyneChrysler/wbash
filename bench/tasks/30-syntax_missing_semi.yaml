id: syntax_missing_semi
kind: fix_lint_or_type
prompt: "Repair the compile or lint failure with the smallest change."
fixture: "fixtures/rust_calc"
setup:
  - "cp variants/parse_error.rs src/lib.rs"
check: "cargo test -q"
bash:
  - "cargo clippy -q -- -D warnings 2>&1 | tail -25 || cargo check -q 2>&1 | tail -25"
  - "perl -0pi -e \"s/\\Qlet (mut a, mut b) = (0u64, 1u64)\n    for\\E/let (mut a, mut b) = (0u64, 1u64);\n    for/\" src/lib.rs"
w:
  - "w --tier execute run -- cargo clippy -q -- -D warnings"
  - "w edit src/lib.rs find=\"let (mut a, mut b) = (0u64, 1u64)\n    for\" replace=\"let (mut a, mut b) = (0u64, 1u64);\n    for\""
