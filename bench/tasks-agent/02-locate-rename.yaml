id: agent_locate_rename
kind: agent
prompt: "Rename parse_config to load_config."
expect:
  - "fn load_config"
check: "grep -q 'fn load_config' crates/wbash-core/src/config.rs"
bash:
  - "grep -rn 'parse_config' crates/wbash-core/src/config.rs crates/wbash-cli/src/lib.rs || true"
  - "sed -i '' 's/parse_config/load_config/g' crates/wbash-core/src/config.rs crates/wbash-cli/src/lib.rs"
w:
  - "w search parse_config crates/wbash-core/src/config.rs crates/wbash-cli/src/lib.rs"
  - "w replace parse_config load_config crates/wbash-core/src/config.rs"
  - "w replace parse_config load_config crates/wbash-cli/src/lib.rs"
