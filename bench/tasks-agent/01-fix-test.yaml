id: agent_fix_test
kind: agent
prompt: "Run tests, fix the bug, and verify."
fixture: "fixtures/rust_calc"
setup:
  - "cp variants/bug_add.rs src/lib.rs"
check: "cargo test -q"
bash:
  - "cargo test -q 2>&1 | tail -20 || true"
  - "cat src/lib.rs"
  - "perl -0pi -e \"s/\\Qpub fn add(a: i32, b: i32) -> i32 {\n    a - b\\E/pub fn add(a: i32, b: i32) -> i32 {\n    a + b/\" src/lib.rs"
  - "cargo test -q"
w:
  - "w --tier execute run -- cargo test -q"
  - "w read src/lib.rs --lines 1:12"
  - "w edit src/lib.rs find=\"pub fn add(a: i32, b: i32) -> i32 {\n    a - b\" replace=\"pub fn add(a: i32, b: i32) -> i32 {\n    a + b\""
  - "w --tier execute run -- cargo test -q"
