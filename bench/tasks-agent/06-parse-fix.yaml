id: agent_parse_fix
kind: agent
prompt: "Fix the parse/logic bug and verify."
fixture: "fixtures/rust_calc"
setup:
  - "cp variants/bug_parse.rs src/lib.rs"
check: "cargo test -q"
bash:
  - "cargo test -q 2>&1 | tail -20 || true"
  - "perl -0pi -e \"s/\\QOk(s.trim().parse().unwrap_or(0).max(0) - 1)\\E/s.trim().parse()/\" src/lib.rs"
  - "cargo test -q"
w:
  - "w --tier execute run -- cargo test -q"
  - "w edit src/lib.rs find=\"Ok(s.trim().parse().unwrap_or(0).max(0) - 1)\" replace=\"s.trim().parse()\""
  - "w --tier execute run -- cargo test -q"
