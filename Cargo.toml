[workspace]
resolver = "2"
members = ["crates/wbash-core", "crates/wbash-index", "crates/wbash-parsers", "crates/wbash-tools", "crates/wbash-adapters", "crates/wbash-cli"]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.4"
edition = "2021"
license = "MIT"
repository = "https://github.com/KlyneChrysler/wbash"
homepage = "https://github.com/KlyneChrysler/wbash"
readme = "README.md"
authors = ["w-bash contributors"]
description = "token-efficient cli and mcp tools for ai coding agents"
keywords = ["ai", "cli", "mcp", "coding-agent", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
blake3 = "1"
regex = "1"
ignore = "0.4"
globset = "0.4"
similar = "2.6"
libc = "0.2"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tempfile = "3"
tiktoken-rs = "0.12"

[profile.release]
lto = "thin"
codegen-units = 1
